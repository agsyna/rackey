    RETURNS:
      - RETURNTYPE: ANY
        RETURNVAR: notion_comment_list
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(retrieve-a-comment_Error400)
        STATUS: 400
        WHEN: Bad request (HTTP 400)
    CANONICAL_ID: notion.comment.list
  notion.comment.create:
