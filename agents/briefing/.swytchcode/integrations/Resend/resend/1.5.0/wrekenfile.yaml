VERSION: 2.0.2
DEFAULTS:
  bearer_token: BEARER <TOKEN>
  w_base_url: https://api.resend.com
METHODS:
  resend.email.create:
    SUMMARY: Send an email
    HTTP:
      METHOD: POST
      ENDPOINT: /emails
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(SendEmailRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Idempotency-Key:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - body:
          TYPE: STRUCT(SendEmailRequest)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(SendEmailResponse)
        RETURNVAR: resend_email_create
        STATUS: 200
    CANONICAL_ID: resend.email.create
  resend.email.list:
    SUMMARY: Retrieve a list of emails
    HTTP:
      METHOD: GET
      ENDPOINT: /emails
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - limit:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
      - after:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - before:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(ListEmailsResponse)
        RETURNVAR: resend_email_list
        STATUS: 200
    CANONICAL_ID: resend.email.list
  resend.email.get:
    SUMMARY: Retrieve a single email
    HTTP:
      METHOD: GET
      ENDPOINT: /emails/{email_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - email_id:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(Email)
        RETURNVAR: resend_email_get
        STATUS: 200
    CANONICAL_ID: resend.email.get
