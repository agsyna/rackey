VERSION: 2.0.2
DEFAULTS:
  bearer_token: BEARER <TOKEN>
  basic_auth: Basic <BASE64>
  w_base_url: https://api.notion.com
METHODS:
  notion.user.get:
    SUMMARY: Retrieve a user
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/users/{user_id}
      HEADERS: {}
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - user_id:
          TYPE: STRING
          LOCATION: path
      - Notion-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
          DEFAULT: "2025-09-03"
    RETURNS:
      - RETURNTYPE: ANY
        RETURNVAR: notion_user_get
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(get-user_Error400)
        STATUS: 400
        WHEN: 400 (HTTP 400)
    CANONICAL_ID: notion.user.get
  notion.user.list:
    SUMMARY: List all users
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/users
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - start_cursor:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - page_size:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 100
      - Notion-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
          DEFAULT: "2025-09-03"
    RETURNS:
      - RETURNTYPE: STRUCT(api.user.listResponse200)
        RETURNVAR: notion_user_list
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(get-users_Error400)
        STATUS: 400
        WHEN: 400 (HTTP 400)
    CANONICAL_ID: notion.user.list
  notion.me.list:
    SUMMARY: Retrieve your token's bot user
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/users/me
      HEADERS: {}
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Notion-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
          DEFAULT: "2025-09-03"
    RETURNS:
      - RETURNTYPE: STRUCT(api.me.listResponse200)
        RETURNVAR: notion_me_list
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(get-self_Error400)
        STATUS: 400
        WHEN: Bad request (HTTP 400)
    CANONICAL_ID: notion.me.list
  notion.search.create:
    SUMMARY: Search by title
    HTTP:
      METHOD: POST
      ENDPOINT: /v1/search
      HEADERS:
        Content-Type: application/json
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(api.search.createRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Notion-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
          DEFAULT: "2025-09-03"
      - body:
          TYPE: STRUCT(api.search.createRequest)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(api.search.createResponse200)
        RETURNVAR: notion_search_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(post-search_Error400)
        STATUS: 400
        WHEN: Bad request (HTTP 400)
    CANONICAL_ID: notion.search.create
