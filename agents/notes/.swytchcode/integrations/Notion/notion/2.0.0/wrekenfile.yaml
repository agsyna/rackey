    CANONICAL_ID: notion.move.create
  notion.markdown.get:
    SUMMARY: Retrieve a page as Markdown
    DESC: Retrieve the full content of a Notion page rendered as enhanced Markdown. Designed for agentic and developer tools that work natively with Markdown instead of the block JSON returned by Retrieve block children.
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/pages/{page_id}/markdown
      HEADERS: {}
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - page_id:
          TYPE: STRING
          LOCATION: path
      - include_transcript:
          TYPE: BOOL
          REQUIRED: false
          LOCATION: query
          DEFAULT: false
      - Notion-Version:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
          DEFAULT: "2026-03-11"
    RETURNS:
      - RETURNTYPE: STRUCT(api.markdown.getResponse200)
        RETURNVAR: notion_markdown_get
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(retrieve-page-markdown_Error400)
        STATUS: 400
        WHEN: Bad request (HTTP 400)
      - TYPE: STRUCT(retrieve-page-markdown_Error403)
        STATUS: 403
        WHEN: The integration lacks the read/update content capability required for this page. (HTTP 403)
      - TYPE: STRUCT(retrieve-page-markdown_Error404)
        STATUS: 404
        WHEN: Page not found or not shared with the integration. (HTTP 404)
      - TYPE: STRUCT(retrieve-page-markdown_Error429)
        STATUS: 429
        WHEN: Rate limited. (HTTP 429)
    CANONICAL_ID: notion.markdown.get
  notion.markdown.update:
    SUMMARY: Update a page's content as Markdown
    DESC: Update the content of a Notion page using enhanced Markdown. Prefer `replace_content` to overwrite the whole page or `update_content` for targeted find-and-replace edits.
    HTTP:
      METHOD: PATCH
      ENDPOINT: /v1/pages/{page_id}/markdown
      HEADERS:
        Content-Type: application/json
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(api.markdown.updateRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - page_id:
          TYPE: STRING
          LOCATION: path
      - Notion-Version:
          TYPE: STRING
          REQUIRED: true
          LOCATION: header
          DEFAULT: "2026-03-11"
      - body:
          TYPE: STRUCT(api.markdown.updateRequest)
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(api.markdown.updateResponse200)
        RETURNVAR: notion_markdown_update
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(update-page-markdown_Error400)
        STATUS: 400
        WHEN: Bad request (HTTP 400)
      - TYPE: STRUCT(update-page-markdown_Error403)
        STATUS: 403
        WHEN: The integration lacks the read/update content capability required for this page. (HTTP 403)
      - TYPE: STRUCT(update-page-markdown_Error404)
        STATUS: 404
        WHEN: Page not found or not shared with the integration. (HTTP 404)
      - TYPE: STRUCT(update-page-markdown_Error409)
        STATUS: 409
        WHEN: Conflict (e.g. row limit exceeded). (HTTP 409)
      - TYPE: STRUCT(update-page-markdown_Error429)
        STATUS: 429
        WHEN: Rate limited. (HTTP 429)
    CANONICAL_ID: notion.markdown.update
STRUCTS:
  richTextRequest:
    - name: text
      type: OBJECT
      REQUIRED: true
    - name: type
      type: STRING
      REQUIRED: false
  pageIdParentRequest:
    - name: page_id
