    RETURNS:
      - RETURNTYPE: STRUCT(api.data_source.createResponse200)
        RETURNVAR: notion_data_source_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(create-a-data-source_Error400)
        STATUS: 400
        WHEN: Bad request (HTTP 400)
    CANONICAL_ID: notion.data_source.create
