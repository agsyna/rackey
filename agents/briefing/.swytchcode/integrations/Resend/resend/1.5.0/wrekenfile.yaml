STRUCTS:
  SendEmailRequest:
    - name: from
      type: STRING
      REQUIRED: true
      comment: Sender email address. To include a friendly name, use the format "Your Name <sender@domain.com>".
    - name: to
      type: ANY
      REQUIRED: true
      comment: Recipient email address. For multiple addresses, send as an array of strings. Max 50.
    - name: subject
      type: STRING
      REQUIRED: true
      comment: Email subject.
    - name: bcc
      type: ANY
      REQUIRED: false
      comment: Bcc recipient email address. For multiple addresses, send as an array of strings.
    - name: cc
      type: ANY
      REQUIRED: false
      comment: Cc recipient email address. For multiple addresses, send as an array of strings.
    - name: reply_to
      type: ANY
      REQUIRED: false
      comment: Reply-to email address. For multiple addresses, send as an array of strings.
    - name: html
      type: STRING
      REQUIRED: false
      comment: The HTML version of the message.
    - name: text
      type: STRING
      REQUIRED: false
      comment: The plain text version of the message.
    - name: template
      type: ANY
      REQUIRED: false
    - name: headers
      type: OBJECT
      REQUIRED: false
      comment: Custom headers to add to the email.
    - name: scheduled_at
      type: STRING
      REQUIRED: false
      comment: Schedule email to be sent later. The date should be in ISO 8601 format.
    - name: attachments
      type: "[]STRUCT(Attachment)"
      REQUIRED: false
    - name: tags
      type: "[]STRUCT(Tag)"
      REQUIRED: false
    - name: topic_id
      type: STRING
      REQUIRED: false
      comment: The topic ID to scope the email to. If the recipient is a contact and opted-in to the topic, the email is sent. If opted-out, the email is not sent. If the recipient is not a contact, the email is sent if the topic's default subscription is opt_in.
  Attachment:
    - name: content
      type: STRING
      REQUIRED: false
      comment: Content of an attached file.
    - name: filename
      type: STRING
      REQUIRED: false
      comment: Name of attached file.
    - name: path
      type: STRING
      REQUIRED: false
      comment: Path where the attachment file is hosted
    - name: content_type
      type: STRING
      REQUIRED: false
      comment: Optional content type for the attachment, if not set it will be derived from the filename property
    - name: content_id
      type: STRING
      REQUIRED: false
      comment: Content ID for embedding inline images using cid references (e.g., cid:image001).
  Tag:
    - name: name
      type: STRING
      REQUIRED: false
      comment: The name of the email tag. It can only contain ASCII letters (a–z, A–Z), numbers (0–9), underscores (_), or dashes (-). It can contain no more than 256 characters.
    - name: value
      type: STRING
      REQUIRED: false
      comment: The value of the email tag.It can only contain ASCII letters (a–z, A–Z), numbers (0–9), underscores (_), or dashes (-). It can contain no more than 256 characters.
  SendEmailResponse:
    - name: id
      type: STRING
      REQUIRED: false
      comment: The ID of the sent email.
  UpdateEmailOptions:
    - name: scheduled_at
      type: STRING
      REQUIRED: false
      comment: Schedule email to be sent later. The date should be in ISO 8601 format.
  Email:
    - name: object
      type: STRING
      REQUIRED: false
      comment: The type of object.
    - name: id
      type: STRING
      REQUIRED: false
      comment: The ID of the email.
    - name: to
      type: "[]STRING"
      REQUIRED: false
    - name: from
      type: STRING
      REQUIRED: false
      comment: The email address of the sender.
    - name: created_at
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time the email was created.
    - name: subject
      type: STRING
      REQUIRED: false
      comment: The subject line of the email.
    - name: html
      type: STRING
      REQUIRED: false
      comment: The HTML body of the email.
    - name: text
      type: STRING
      REQUIRED: false
      comment: The plain text body of the email.
    - name: bcc
      type: "[]STRING"
      REQUIRED: false
      comment: The email addresses of the blind carbon copy recipients.
    - name: cc
      type: "[]STRING"
      REQUIRED: false
      comment: The email addresses of the carbon copy recipients.
    - name: reply_to
      type: "[]STRING"
      REQUIRED: false
      comment: The email addresses to which replies should be sent.
    - name: last_event
      type: STRING
      REQUIRED: false
      comment: The status of the email.
  ListEmailsResponse:
    - name: object
      type: STRING
      REQUIRED: false
      comment: Type of the response object.
    - name: has_more
      type: BOOL
      REQUIRED: false
      comment: Indicates if there are more results available.
    - name: data
      type: "[]STRUCT(Email)"
      REQUIRED: false
      comment: Array containing email information.
  CreateBatchEmailsResponse:
    - name: data
      type: "[]ANY"
      REQUIRED: false
  DomainCapabilities:
    - name: sending
      type: STRING
      REQUIRED: false
      comment: Enable or disable sending emails from this domain.
    - name: receiving
      type: STRING
      REQUIRED: false
      comment: Enable or disable receiving emails to this domain.
  CreateDomainRequest:
    - name: name
      type: STRING
      REQUIRED: true
      comment: The name of the domain you want to create.
    - name: region
      type: STRING
      REQUIRED: false
      comment: The region where emails will be sent from. Possible values are us-east-1 | eu-west-1 | sa-east-1 | ap-northeast-1
    - name: custom_return_path
      type: STRING
      REQUIRED: false
      comment: For advanced use cases, choose a subdomain for the Return-Path address. Defaults to 'send' (i.e., send.yourdomain.tld).
    - name: open_tracking
      type: BOOL
      REQUIRED: false
      comment: Track the open rate of each email.
    - name: click_tracking
      type: BOOL
      REQUIRED: false
      comment: Track clicks within the body of each HTML email.
    - name: tls
      type: STRING
      REQUIRED: false
      comment: TLS mode. Opportunistic attempts secure connection but falls back to unencrypted. Enforced requires TLS or email won't be sent.
    - name: capabilities
      type: STRUCT(DomainCapabilities)
      REQUIRED: false
    - name: tracking_subdomain
      type: STRING
      REQUIRED: false
      comment: The subdomain to use for click and open tracking.
  CreateDomainResponse:
    - name: id
      type: STRING
      REQUIRED: false
      comment: The ID of the domain.
    - name: name
      type: STRING
      REQUIRED: false
      comment: The name of the domain.
    - name: created_at
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time the domain was created.
    - name: status
      type: STRING
      REQUIRED: false
      comment: The status of the domain.
    - name: capabilities
      type: STRUCT(DomainCapabilities)
      REQUIRED: false
    - name: records
      type: "[]STRUCT(DomainRecord)"
      REQUIRED: false
    - name: region
      type: STRING
      REQUIRED: false
      comment: The region where the domain is hosted.
    - name: open_tracking
      type: BOOL
      REQUIRED: false
      comment: Whether open tracking is enabled for this domain.
    - name: click_tracking
      type: BOOL
      REQUIRED: false
      comment: Whether click tracking is enabled for this domain.
    - name: tracking_subdomain
      type: STRING
      REQUIRED: false
      comment: The subdomain used for click and open tracking.
  DomainRecord:
    - name: record
      type: STRING
      REQUIRED: false
      comment: The type of record (SPF for sending, DKIM for sending, Receiving for inbound emails, Tracking for click and open tracking).
    - name: name
      type: STRING
      REQUIRED: false
      comment: The name of the DNS record.
    - name: type
      type: STRING
      REQUIRED: false
      comment: The DNS record type.
    - name: ttl
      type: STRING
      REQUIRED: false
      comment: The time to live for the record.
    - name: status
      type: STRING
      REQUIRED: false
      comment: The status of the record.
    - name: value
      type: STRING
      REQUIRED: false
      comment: The value of the record.
    - name: priority
      type: INT
      REQUIRED: false
      comment: The priority of the record (only applicable for MX records).
  UpdateDomainOptions:
    - name: open_tracking
      type: BOOL
      REQUIRED: false
      comment: Track the open rate of each email.
    - name: click_tracking
      type: BOOL
      REQUIRED: false
      comment: Track clicks within the body of each HTML email.
    - name: tls
      type: STRING
      REQUIRED: false
      comment: enforced | opportunistic.
    - name: capabilities
      type: STRUCT(DomainCapabilities)
      REQUIRED: false
    - name: tracking_subdomain
      type: STRING
      REQUIRED: false
      comment: The subdomain to use for click and open tracking.
  Domain:
